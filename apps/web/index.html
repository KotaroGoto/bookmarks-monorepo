<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookmarks</title>
  <style>
    body {
      max-width: 600px;
      margin: 24px auto;
      padding: 0 16px;
      font-family: system-ui, sans-serif;
      color: #222;
    }

    button {
      padding: 6px 14px;
      border: 1px solid #2563eb;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
    }

    input {
      padding: 6px 8px;
      border: 1px solid #bbb;
      border-radius: 6px;
    }

    #status {
      color: #555;
    }

    form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    form[hidden] {
      display: none;
    }

    ul {
      padding: 0;
      list-style: none;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #ddd;
    }

    a {
      color: #1d4ed8;
      text-decoration: none;
    }

    li button {
      border-color: #ccc;
      background: #fff;
      color: #c00;
    }
  </style>
</head>

<body>
  <button id="reload" type="button">読み込む</button>
  <p id="status"></p>
  <form id="bookmark-form" hidden>
    <input name="url" type="url" placeholder="URL" required>
    <input name="title" type="text" placeholder="タイトル" required>
    <input name="tags" type="text" placeholder="タグ（カンマ区切り）">
    <button type="submit">追加</button>
  </form>
  <ul id="list"></ul>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
